# Twin of .forgejo/workflows/ci.yml. Forgejo reads .forgejo/workflows first
# and only falls back to this directory when it is absent, so the two are one
# file per forge rather than duplicates to keep in sync by copy-paste.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The same hooks the local commit hook runs, so a green CI means a clean
      # `pre-commit run --all-files` on the developer's machine and vice versa.
      - name: pre-commit
        run: nix develop .#ci -c pre-commit run --all-files --show-diff-on-failure

      # Builds the crate, which runs `cargo test` in checkPhase.
      - name: build
        run: nix build .#default --print-build-logs

      - name: nix flake check
        run: nix flake check --no-build --print-build-logs

      # The one check `--no-build` skips that needs running: each test brings
      # up its own tmux server on a private socket.
      - name: tmux tests
        run: nix build .#checks.x86_64-linux.tmux --print-build-logs

  # yt-audio is a plain cargo crate in the workspace; the nix build above only
  # covers it through checkPhase, so this adds clippy and both feature sets.
  cargo:
    name: "yt-audio (cargo ${{ matrix.features || 'default' }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--features llm"]
    env:
      # Debug info buys nothing in CI and bloats the cache that is saved and
      # restored on every run.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache key for this matrix leg
        id: ck
        run: echo "k=$(printf '%s' '${{ matrix.features }}' | tr -cd '[:alnum:]' | cut -c1-32)" >> "$GITHUB_OUTPUT"

      # Each matrix leg needs its OWN cache. Without this both legs hash to the
      # same rust-cache key and overwrite each other, so a leg restores a target
      # directory built for the other feature set and cargo rebuilds most of it.
      # Sanitised to alphanumerics: the raw matrix value contains spaces.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.ck.outputs.k }}

      - run: cargo clippy -p yt-audio --all-targets ${{ matrix.features }} -- -D warnings

      # Tests needing ffmpeg skip without it; those spawning sh scripts need sh.
      - run: cargo test -p yt-audio ${{ matrix.features }}
