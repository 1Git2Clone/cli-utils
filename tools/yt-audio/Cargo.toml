[package]
name = "yt-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Download YouTube audio with tidy tags and filenames"
license = "MIT"

[features]
llm = ["dep:llm", "dep:tokio"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
lofty = "0.22"
thiserror = "2.0"
llm = { version = "1.3", optional = true, default-features = false, features = ["openai", "ollama", "rustls-tls"] }
tokio = { version = "1", optional = true, features = ["rt"] }

[lints.rust]
unsafe_code = "forbid"
