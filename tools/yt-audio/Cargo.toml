[package]
name = "yt-audio"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Download YouTube audio with tidy tags and filenames"
license = "MIT"
repository = "https://git.hu-tao.dev/hutao/cli-utils"

[features]
llm = ["dep:llm"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
lofty = "0.22"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "time"] }
futures-util = "0.3"
url = { version = "2.5", features = ["serde"] }
jiff = "0.2"
llm = { version = "1.3", optional = true, default-features = false, features = ["openai", "ollama", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "sync"] }

[lints.rust]
unsafe_code = "forbid"
