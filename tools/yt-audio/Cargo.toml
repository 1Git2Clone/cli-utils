[package]
name = "yt-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Download YouTube audio with tidy tags and filenames"
license = "MIT"

[features]
llm = []

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
